<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ADONAI · 05 Particle Morph</title>
<style>
  html,body{margin:0;height:100%;background:#07182D;overflow:hidden;cursor:crosshair}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin-left:-960px;margin-top:-540px;transform-origin:center;background:#07182D}
  #cv{position:absolute;inset:0}
  #hint{position:absolute;bottom:84px;left:0;right:0;text-align:center;font:400 19px 'Geist Mono';letter-spacing:.3em;color:#31DDD4;opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="hint">MOVA O CURSOR — AS PARTÍCULAS REAGEM</div>
</div>
<script src="motion-core.js"></script>
<script>
const { lerp, seg, inOutCubic, outCubic, rng, TAU, C } = ADN;
// a Manrope só é usada em canvas aqui — força o download antes de amostrar
window.__waitFonts = () => document.fonts.load("600 330px 'Manrope'");
const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ADN.fitStage(stage);
const tc = ADN.hud(stage, 'MG/05 — PARTICLE MORPH · INTERATIVO');
DUR = window.DUR = 8;
window.ADN_PIECE = '05-particles';

const W = 1920, H = 1080, N = 2600;

// ---- amostragem de formas-alvo (offscreen) ----
function samplePoints(draw) {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d');
  draw(o);
  const data = o.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += 5)
    for (let x = 0; x < W; x += 5)
      if (data[(y * W + x) * 4 + 3] > 120) pts.push([x, y]);
  return pts;
}
function drawSymbol(o) {
  // símbolo oficial: A sólido (topo flat) + crossbar + nó — tudo branco p/ amostragem
  const sc = 7, ox = 960 - 32 * sc, oy = 540 - 30.5 * sc;
  o.save(); o.translate(ox, oy); o.scale(sc, sc);
  o.fillStyle = '#fff';
  o.fill(new Path2D('M15 46 30 15h7l12 31h-9l-6.5-18.5L25 46H15Z'));
  o.restore();
  o.strokeStyle = '#fff'; o.lineWidth = 26; o.lineCap = 'round';
  o.beginPath(); o.moveTo(ox + 28 * sc, oy + 38 * sc); o.lineTo(ox + 44 * sc, oy + 38 * sc); o.stroke();
  o.fillStyle = '#fff';
  o.beginPath(); o.arc(ox + 46 * sc, oy + 38 * sc, 17, 0, TAU); o.fill();
}
function drawWord(o) {
  o.fillStyle = '#fff';
  o.font = "600 330px 'Manrope'";
  o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText('ADONAI', 960, 560);
}
// amostragem lazy (precisa da Manrope carregada)
let PTS_A = null, PTS_W = null, parts = null;
function ensureInit() {
  if (parts) return;
  PTS_A = samplePoints(drawSymbol);
  PTS_W = samplePoints(drawWord);
  const rnd = rng(42);
  parts = [];
  for (let i = 0; i < N; i++) {
    parts.push({
      sx: rnd() * W, sy: rnd() * H,                          // estado inicial disperso (loop)
      a: PTS_A[Math.floor(rnd() * PTS_A.length)],
      w: PTS_W[Math.floor(rnd() * PTS_W.length)],
      sc: [(rnd() - 0.5) * W * 1.2, (rnd() - 0.5) * H * 1.2], // alvo da explosão
      ph: rnd() * TAU, sz: 1.4 + rnd() * 1.3,
      col: rnd() < 0.7 ? C.teal : (rnd() < 0.66 ? C.mint : '#FFFFFF'),
      st: rnd() * 0.25,                                       // stagger
    });
  }
}

// fases: (t_início, t_fim, getter do alvo)
const PH = [
  { t0: 0.0,  t1: 0.7,  tgt: p => [p.sx, p.sy], k: 0 },        // drift inicial
  { t0: 0.7,  t1: 1.7,  tgt: p => p.a,     k: 1 },              // → símbolo A
  { t0: 1.7,  t1: 3.1,  tgt: p => p.a,     k: 0 },              // hold A
  { t0: 3.1,  t1: 3.55, tgt: p => p.sc,    k: 2 },              // explosão
  { t0: 3.55, t1: 4.45, tgt: p => p.w,     k: 3 },              // → wordmark
  { t0: 4.45, t1: 6.7,  tgt: p => p.w,     k: 0 },              // hold wordmark
  { t0: 6.7,  t1: 7.7,  tgt: p => [p.sx, p.sy], k: 4 },        // volta ao caos = frame 0
  { t0: 7.7,  t1: 8.0,  tgt: p => [p.sx, p.sy], k: 0 },
];

// mouse (repulsão) — fallback orbital automático
let mx = -9999, my = -9999, hasMouse = false;
addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  mx = (e.clientX - r.left) / r.width * W;
  my = (e.clientY - r.top) / r.height * H;
  hasMouse = true;
});

function render(t) {
  tc(t);
  ensureInit();
  ctx.fillStyle = C.navy; ctx.fillRect(0, 0, W, H);

  const rx = hasMouse ? mx : 960 + 560 * Math.cos(t * 0.85);
  const ry = hasMouse ? my : 540 + 320 * Math.sin(t * 0.62);

  // fase corrente e âncora anterior p/ interpolação determinística
  let fi = PH.findIndex(f => t >= f.t0 && t < f.t1);
  if (fi < 0) fi = PH.length - 1;
  const f = PH[fi], prev = PH[Math.max(0, fi - 1)];

  for (const p of parts) {
    let x, y;
    if (f.k === 0) {
      // hold: respiração em torno do alvo da própria fase
      const [tx, ty] = f.tgt(p);
      x = tx + Math.sin(t * 0.9 + p.ph) * 11;
      y = ty + Math.cos(t * 0.8 + p.ph) * 11;
    } else {
      const e = inOutCubic(seg(t, f.t0 + p.st * 0.3, f.t1 - (1 - p.st) * 0.1));
      const [fx0, fy0] = posAt(prev, p, t);
      const [tx, ty] = f.tgt(p);
      x = lerp(fx0, tx, e); y = lerp(fy0, ty, e);
    }
    // vida: respiração quando "preso" no alvo
    const hold = f.k === 0 ? 0 : (seg(t, f.t0, f.t1) === 1 ? 1 : 0.4);
    x += Math.sin(t * 2.4 + p.ph) * 1.6 * hold;
    y += Math.cos(t * 2.1 + p.ph) * 1.6 * hold;

    // repulsão do cursor (suave quando é o fantasma automático)
    const RR = hasMouse ? 150 : 80, RF = hasMouse ? 90 : 38;
    const dx = x - rx, dy = y - ry, d2 = dx * dx + dy * dy;
    if (d2 < RR * RR && d2 > 0.01) {
      const d = Math.sqrt(d2), force = (1 - d / RR) ** 2 * RF;
      x += dx / d * force; y += dy / d * force;
    }
    ctx.fillStyle = p.col;
    ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(x, y, p.sz, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // glow central acompanha a forma
  const focusY = (fi <= 2 || fi >= 6) ? 540 : 560;
  const g = ctx.createRadialGradient(960, focusY, 10, 960, focusY, 420);
  g.addColorStop(0, 'rgba(49,221,212,.10)');
  g.addColorStop(1, 'rgba(49,221,212,0)');
  ctx.fillStyle = g; ctx.fillRect(540, focusY - 420, 840, 840);
}

// posição determinística "ao fim da fase anterior"
function posAt(phase, p, t) {
  if (phase.k === 0) {
    const [tx, ty] = phase.tgt(p);
    return [tx + Math.sin(t * 0.9 + p.ph) * 11, ty + Math.cos(t * 0.8 + p.ph) * 11];
  }
  const e = inOutCubic(Math.min(1, seg(t, phase.t0 + p.st * 0.3, phase.t1)));
  const [tx, ty] = phase.tgt(p);
  return [lerp(p.sx, tx, e), lerp(p.sy, ty, e)];
}
</script>
<script src="sound-engine.js"></script>
<script src="audio.js"></script>
</body>
</html>
