<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ADONAI · 01 Gênese — Logo Reveal</title>
<style>
  html,body{margin:0;height:100%;background:#07182D;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin-left:-960px;margin-top:-540px;transform-origin:center;background:#07182D}
  #cv{position:absolute;inset:0}
  .wm{position:absolute;left:0;right:0;text-align:center;opacity:0;will-change:transform,opacity,letter-spacing}
  #word{top:636px;font:600 104px/1 'Manrope';color:#FFFFFF;white-space:nowrap;letter-spacing:-0.02em}
  #lock{top:780px;font:500 25px 'Geist Mono';letter-spacing:.52em;color:#31DDD4;text-indent:.52em}
  #shine{position:absolute;inset:0;-webkit-background-clip:text;background-clip:text;color:transparent;background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);background-size:300% 100%;background-repeat:no-repeat}
  #tag{top:874px;font:400 24px 'Geist Mono';letter-spacing:.34em;color:#78EEC7}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div class="wm" id="word">ADONAI<span id="shine" aria-hidden="true">ADONAI</span></div>
  <div class="wm" id="lock">GENIUS SOLUTIONS</div>
  <div class="wm" id="tag"></div>
</div>
<script src="motion-core.js"></script>
<script>
const { lerp, seg, outExpo, outCubic, inOutCubic, rng, C } = ADN;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ADN.fitStage(stage);
const tc = ADN.hud(stage, 'MG/01 — GÊNESE · LOGO REVEAL');
DUR = window.DUR = 6;
window.ADN_PIECE = '01-genesis';

const W = 1920, H = 1080, CX = W / 2, CY = 420; // centro do A (32,30.5 no viewBox 64)
const S = 7; // escala do símbolo oficial
const N = 1000;
const rnd = rng(20260927);
const targets = ADN.logoPoints(N).map(p => ({ x: CX + (p.x - 32) * S, y: CY + (p.y - 30.5) * S }));
const parts = targets.map((tg, i) => {
  const a = rnd() * Math.PI * 2, r = 380 + rnd() * 720;
  return {
    sx: CX + Math.cos(a) * r, sy: CY + Math.sin(a) * r * 0.62,
    tx: tg.x, ty: tg.y,
    d0: 0.45 + (i / N) * 1.15 + rnd() * 0.25,   // início da convergência (stagger)
    ph: rnd() * Math.PI * 2, sz: 1.3 + rnd() * 1.5,
    col: rnd() < 0.55 ? C.teal : (rnd() < 0.62 ? '#F7F8F4' : C.mint),
  };
});

const TAG = 'TECNOLOGIA PARA OPERAÇÕES AMBICIOSAS';

function render(t) {
  tc(t);
  ctx.clearRect(0, 0, W, H);

  // grade técnica (igual ao hero do site)
  const gridA = 0.06 * seg(t, 0.1, 0.9) * (1 - seg(t, 5.2, 5.9));
  if (gridA > 0.001) {
    ctx.strokeStyle = `rgba(49,221,212,${gridA})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 120; x < W; x += 120) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 120; y < H; y += 120) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  // glow radial sob o símbolo
  const conv0 = seg(t, 0.45, 1.9);
  const glow = ctx.createRadialGradient(CX, CY, 10, CX, CY, 340);
  glow.addColorStop(0, `rgba(49,221,212,${0.14 * conv0})`);
  glow.addColorStop(1, 'rgba(49,221,212,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(CX - 340, CY - 340, 680, 680);

  // partículas
  for (const p of parts) {
    const e = inOutCubic(seg(t, p.d0, p.d0 + 1.15));
    const wob = e >= 1 ? Math.sin(t * 2.2 + p.ph) * 1.4 : 0;
    const x = lerp(p.sx, p.tx, e) + wob;
    const y = lerp(p.sy, p.ty, e) + Math.cos(t * 2 + p.ph) * (e >= 1 ? 1.4 : 0.6 * e);
    ctx.globalAlpha = 0.25 + 0.75 * e;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(x, y, p.sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // sweep de luz vertical sobre o símbolo
  const sp = seg(t, 2.35, 2.95);
  if (sp > 0 && sp < 1) {
    const x = lerp(-300, W + 300, outCubic(sp));
    const g = ctx.createLinearGradient(x - 160, 0, x + 160, 0);
    g.addColorStop(0, 'rgba(120,238,199,0)');
    g.addColorStop(0.5, `rgba(190,255,245,${0.5 * Math.sin(Math.PI * sp)})`);
    g.addColorStop(1, 'rgba(120,238,199,0)');
    ctx.fillStyle = g; ctx.globalCompositeOperation = 'lighter';
    ctx.fillRect(x - 160, 0, 320, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // wordmark (Manrope 600, igual h1 do site) + lockup oficial
  const wp = seg(t, 2.95, 3.62), we = outExpo(wp);
  const word = document.getElementById('word');
  word.style.opacity = we;
  word.style.letterSpacing = `${lerp(0.12, -0.02, we)}em`;
  word.style.transform = `translateY(${lerp(26, 0, we)}px)`;
  const sh = seg(t, 4.55, 5.45);
  document.getElementById('shine').style.backgroundPosition = `${lerp(-120, 220, sh)}% 0`;

  const le = outExpo(seg(t, 3.25, 3.85));
  const lock = document.getElementById('lock');
  lock.style.opacity = le * (1 - seg(t, 5.55, 6));
  lock.style.letterSpacing = `${lerp(0.9, 0.52, le)}em`;

  // eyebrow typewriter (frase real do site)
  const tp = seg(t, 3.75, 5.05);
  const chars = Math.floor(tp * TAG.length);
  document.getElementById('tag').textContent = TAG.slice(0, chars) + (tp > 0 && tp < 1 ? '▌' : '');
  document.getElementById('tag').style.opacity = tp > 0 ? 1 : 0;

  // fade final p/ corte limpo
  const out = seg(t, 5.55, 6);
  ctx.fillStyle = `rgba(7,24,45,${out})`;
  ctx.fillRect(0, 0, W, H);
}
</script>
<script src="sound-engine.js"></script>
<script src="audio.js"></script>
</body>
</html>
